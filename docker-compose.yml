services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PROTOCOLLENS_ADDR: ":8080"
      PROTOCOLLENS_DATABASE_PATH: /data/protocollens.db
    volumes:
      - ./data:/data

  web:
    image: node:24
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./web:/app
    depends_on:
      - api
